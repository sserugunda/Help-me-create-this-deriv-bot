version: "3.8"
services:
  deriv-bot:
    build: .
    restart: always
    environment:
      - DERIV_APP_ID=${DERIV_APP_ID}
      - DERIV_API_TOKEN=${DERIV_API_TOKEN}
      - STAKE_AMOUNT=${STAKE_AMOUNT:-0.5}
      - SYMBOLS_CSV=${SYMBOLS_CSV:-1HZ10V,R10,1HZ15V,R25,1HZ25V,1HZ30V,1HZ50V,R50,1HZ75V,R75,1HZ90V,1HZ100V,R100}
      - RSI_UPPER=55
      - RSI_LOWER=45
      - EMA_PERIOD=50
      - RSI_PERIOD=2
      - ENTRY_SECOND_THRESHOLD=58
      - TRADE_DURATION_SECONDS=55
      - MAX_SYMBOLS=13
